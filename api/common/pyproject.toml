[project]
name = "maisciencia-common"
version = "0.1.0"
description = "Shared initialization and infrastructure for Maisciencia services"
requires-python = ">=3.11,<4.0"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "pymongo (>=4.19.0,<5.0.0)",
    "flask-cors (>=6.0.5,<7.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
]

[tool.poetry]
packages = [{include = "maisciencia_common"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
